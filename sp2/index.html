<html>
<head>
	<title>SP2xUCP - Test Service Provider</title>
  <meta http-equiv="Content-Security-Policy" content="script-src 'self' 'unsafe-inline'">
  <script src="sp2.js">
  </script>
<link href="//cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
	
</head>
<body>
<div class="container-xxl mt-7 pt-7">
	<div class="container">
		<header class="d-flex flex-wrap py-3 mb-4 border-bottom">
			<span class="fs-4"> Service Provider - Account Linking Flow</span>
		</header>
	</div>
	
	<fieldset>
		<div class="container-md">
			<div class="mb-4">
				<label for="spmcid" class="form-label">SP MC ID:</label> 
				<input type="text" id="spmcid" name="spmcid" class="form-control" value="5825924880">  
				<div id="spmcidHelpBlock" class="form-text">
					Enter the Merchant Center Id of the Serivce Provider account.
				</div>
			</div>
			<div class="mb-4">
				<label for="spclientid" class="form-label">SP Client Id:</label>
				<input type="text" id="spclientid" name="spclientid" class="form-control" value="xyz-abc-123"> 
				<div id="spmcidHelpBlock" class="form-text">
					Enter the identifier of the merchant's account in the Serivce Provider's system.
				</div>
			</div>
			<div class="mb-4">
				<button id="linkButton" class="btn btn-primary">Link Merchant Center Account</button> 
			</div>
		</div>
	</fieldset>

	<div class="container">
		<fieldset>
			<legend class="border-bottom">Linking Output</legend>
			<div id="messageOutput">
			</div>
		</fieldset>
	</div>
</div>
</body>
</html>
